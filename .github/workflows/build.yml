name: Build

# Every push and PR: typecheck + build the Windows app (downloadable from the run's artifacts).
# Every push to main, and every version tag (v1.2.3), also publishes a GitHub Release with stable file names,
# which the README links to:
#   https://github.com/terraseraph/ShotDrop/releases/latest/download/ShotDrop-win-x64.zip
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create the release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Tags use their own number (v1.2.3 → 1.2.3). Every push to main gets <major>.<minor>.<run number>,
      # so each main build is its own release and the README's "latest" links always serve the newest one.
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            v="$base.${{ github.run_number }}"
          fi
          npm version "$v" --no-git-tag-version --allow-same-version > /dev/null
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building ShotDrop $v"

      - name: Typecheck
        run: npm run typecheck

      - name: Cache bundled tools (rclone, cloudflared, ffmpeg, LibRaw)
        uses: actions/cache@v4
        with:
          path: resources/bin/win-x64
          key: bins-${{ hashFiles('scripts/fetch-binaries.mjs') }}

      - name: Build portable app (zip + single exe)
        run: npm run dist:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build; see docs/packaging.md
          # ShotDrop's own Google OAuth client, baked into the main bundle (see src/main/core/cloud.ts).
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShotDrop-windows-${{ github.sha }}
          path: |
            release/ShotDrop-win-x64.zip
            release/ShotDrop-portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ShotDrop ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            release/ShotDrop-win-x64.zip
            release/ShotDrop-portable.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
