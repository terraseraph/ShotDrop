<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Live sync as you shoot: Camera to ShotDrop on your PC, then to Google Drive and Dropbox by signing in, to a NAS, folder or your own SFTP, FTP or WebDAV server, and to storage services like Amazon S3, Backblaze B2, Cloudflare R2 and Wasabi">
  <!--
    ShotDrop flow chart for the README. Plain SVG + CSS, edit freely.
    Colours: camera #f5a524 · PC #58a6ff · sign in #34a853 · network #a371f7 · storage #ff9900
    Destination groups sit at y = 74 / 194 / 314 (wire targets 130 / 250 / 384); the PC centre is y = 262.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141b"/>
      <stop offset="1" stop-color="#151b24"/>
    </linearGradient>
    <linearGradient id="pc-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity=".02"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 15px; font-weight: 700; fill: #e6edf3; letter-spacing: .2px; }
      .live  { font-size: 11px; font-weight: 800; fill: #ff5c5c; letter-spacing: 1.5px; }
      .label { font-size: 15px; font-weight: 700; fill: #e6edf3; }
      .name  { font-size: 13px; font-weight: 700; fill: #e6edf3; }
      .sub   { font-size: 11.5px; fill: #8b949e; }
      .small { font-size: 10.5px; fill: #8b949e; }
      .tag   { font-size: 10.5px; font-weight: 600; fill: #8b949e; letter-spacing: .4px; }
      .group { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; }
      .badge { font-size: 10.5px; font-weight: 800; }
      .card  { fill: #161b22; stroke-width: 1.5; }
      .panel { fill: #11161d; stroke-width: 1.2; stroke-dasharray: 3 4; }
      .tile  { fill: #161b22; stroke: #30363d; stroke-width: 1.2; }
      .wire  { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 2 9; animation: flow 1s linear infinite; }
      .base  { fill: none; stroke: #30363d; stroke-width: 2; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      .thumb { animation: pop 3s ease-out infinite; opacity: 0; }
      .t2 { animation-delay: .5s; } .t3 { animation-delay: 1s; }
      @keyframes flow  { to { stroke-dashoffset: -22; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
      @keyframes pop   { 0% { opacity: 0; } 12%, 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="899" height="479" rx="16" fill="none" stroke="#30363d"/>

  <!-- header -->
  <g transform="translate(40 40)">
    <rect x="0" y="-13" width="58" height="22" rx="11" fill="#ff5c5c" fill-opacity=".12" stroke="#ff5c5c" stroke-opacity=".5"/>
    <circle class="pulse" cx="13" cy="-2" r="4" fill="#ff5c5c"/>
    <text class="live" x="22" y="2">LIVE</text>
    <text class="title" x="72" y="3">Synced as you shoot</text>
  </g>

  <!-- wires (grey base + animated colour on top) -->
  <path id="w0" class="base" d="M190 262 H262"/>
  <path class="wire" stroke="#f5a524" d="M190 262 H262"/>
  <text class="tag" x="226" y="250" text-anchor="middle">WI-FI</text>
  <text class="tag" x="226" y="282" text-anchor="middle">FTP</text>

  <path id="w1" class="base" d="M462 262 C500 262 500 130 538 130"/>
  <path id="w2" class="base" d="M462 262 C500 262 500 250 538 250"/>
  <path id="w3" class="base" d="M462 262 C500 262 500 384 538 384"/>
  <path class="wire" stroke="#34a853" d="M462 262 C500 262 500 130 538 130"/>
  <path class="wire" stroke="#a371f7" d="M462 262 C500 262 500 250 538 250"/>
  <path class="wire" stroke="#ff9900" d="M462 262 C500 262 500 384 538 384"/>

  <!-- photos travelling -->
  <circle r="4.5" fill="#f5a524"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#w0"/></animateMotion></circle>
  <circle r="4" fill="#34a853"><animateMotion dur="1.6s" begin=".2s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
  <circle r="4" fill="#a371f7"><animateMotion dur="1.6s" begin=".7s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
  <circle r="4" fill="#ff9900"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>

  <!-- camera -->
  <rect class="card" x="40" y="197" width="150" height="130" rx="14" stroke="#f5a524"/>
  <g transform="translate(115 238)" fill="none" stroke="#f5a524" stroke-width="2.4" stroke-linejoin="round">
    <path d="M-24 -10 h12 l4 -7 h16 l4 7 h12 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-48 a4 4 0 0 1 -4 -4 v-22 a4 4 0 0 1 4 -4 z"/>
    <circle cx="0" cy="4" r="9"/>
    <circle cx="0" cy="4" r="3.5" fill="#f5a524"/>
    <circle class="pulse" cx="19" cy="-4" r="2" fill="#ff5c5c" stroke="none"/>
  </g>
  <text class="label" x="115" y="291" text-anchor="middle">Camera</text>
  <text class="sub" x="115" y="309" text-anchor="middle">Sony · Canon · Nikon · Fuji</text>

  <!-- PC -->
  <rect class="card" x="262" y="187" width="200" height="150" rx="14" stroke="#58a6ff"/>
  <rect x="263" y="188" width="198" height="148" rx="13" fill="url(#pc-glow)"/>
  <g transform="translate(362 232)">
    <rect x="-34" y="-24" width="68" height="44" rx="5" fill="#0d1117" stroke="#58a6ff" stroke-width="2.4"/>
    <path d="M-12 30 h24 M0 20 v10" stroke="#58a6ff" stroke-width="2.4" stroke-linecap="round"/>
    <rect class="thumb"    x="-28" y="-18" width="17" height="14" rx="2" fill="#f5a524"/>
    <rect class="thumb t2" x="-8"  y="-18" width="17" height="14" rx="2" fill="#58a6ff"/>
    <rect class="thumb t3" x="12"  y="-18" width="17" height="14" rx="2" fill="#a371f7"/>
    <rect x="-28" y="0" width="57" height="4" rx="2" fill="#30363d"/>
    <rect x="-28" y="8" width="36" height="4" rx="2" fill="#30363d"/>
  </g>
  <text class="label" x="362" y="294" text-anchor="middle">ShotDrop on your PC</text>
  <text class="sub" x="362" y="312" text-anchor="middle">preview · cull · rate</text>

  <!-- ===== Group 1: sign in ===== -->
  <rect class="panel" x="538" y="74" width="322" height="112" rx="12" stroke="#34a853"/>
  <text class="group" x="554" y="96" fill="#34a853">SIGN IN</text>
  <text class="small" x="844" y="96" text-anchor="end">nothing to type</text>

  <rect class="tile" x="554" y="108" width="140" height="62" rx="10"/>
  <g transform="translate(578 132)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M-10 6 L0 -11" stroke="#34a853"/>
    <path d="M0 -11 L10 6" stroke="#fbbc04"/>
    <path d="M10 6 H-10" stroke="#4285f4"/>
  </g>
  <text class="name" x="600" y="134">Google Drive</text>
  <text class="small" x="568" y="158">safe mode or all folders</text>
  <circle class="pulse" cx="682" cy="120" r="3.5" fill="#34a853"/>

  <rect class="tile" x="704" y="108" width="140" height="62" rx="10"/>
  <g transform="translate(728 130)" fill="#0061ff">
    <path d="M-6 -11 l6 4 l-6 4 l-6 -4 z"/>
    <path d="M6 -11 l6 4 l-6 4 l-6 -4 z"/>
    <path d="M-6 -3 l6 4 l-6 4 l-6 -4 z"/>
    <path d="M6 -3 l6 4 l-6 4 l-6 -4 z"/>
    <path d="M0 6 l6 4 l-6 4 l-6 -4 z"/>
  </g>
  <text class="name" x="750" y="134">Dropbox</text>
  <text class="small" x="718" y="158">one-click sign-in</text>
  <circle class="pulse" cx="832" cy="120" r="3.5" fill="#0061ff" style="animation-delay:.3s"/>

  <!-- ===== Group 2: your network ===== -->
  <rect class="panel" x="538" y="194" width="322" height="112" rx="12" stroke="#a371f7"/>
  <text class="group" x="554" y="216" fill="#a371f7">YOUR NETWORK</text>
  <text class="small" x="844" y="216" text-anchor="end">shares and servers</text>

  <rect class="tile" x="554" y="228" width="140" height="62" rx="10"/>
  <g transform="translate(578 250)" fill="none" stroke="#a371f7" stroke-width="2">
    <rect x="-11" y="-12" width="22" height="7" rx="2"/>
    <rect x="-11" y="-3"  width="22" height="7" rx="2"/>
    <rect x="-11" y="6"   width="22" height="7" rx="2"/>
    <g fill="#a371f7" stroke="none"><circle cx="6" cy="-8.5" r="1.4"/><circle cx="6" cy=".5" r="1.4"/><circle cx="6" cy="9.5" r="1.4"/></g>
  </g>
  <text class="name" x="600" y="254">NAS · Folder</text>
  <text class="small" x="568" y="278">shares, USB, other drives</text>
  <circle class="pulse" cx="682" cy="240" r="3.5" fill="#a371f7" style="animation-delay:.6s"/>

  <rect class="tile" x="704" y="228" width="140" height="62" rx="10"/>
  <g transform="translate(728 250)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-12" y="-11" width="24" height="18" rx="3"/>
    <path d="M-6 -4 l4 3 l-4 3 M1 2 h5"/>
    <path d="M-5 11 h10"/>
  </g>
  <text class="name" x="750" y="254">Your server</text>
  <text class="small" x="718" y="278">SFTP · FTP · WebDAV</text>
  <circle class="pulse" cx="832" cy="240" r="3.5" fill="#2dd4bf" style="animation-delay:.9s"/>

  <!-- ===== Group 3: storage services ===== -->
  <rect class="panel" x="538" y="314" width="322" height="140" rx="12" stroke="#ff9900"/>
  <text class="group" x="554" y="336" fill="#ff9900">STORAGE SERVICES</text>
  <text class="small" x="844" y="336" text-anchor="end">paste an access key</text>

  <rect class="tile" x="554" y="348" width="140" height="42" rx="10"/>
  <rect x="566" y="358" width="24" height="22" rx="6" fill="#2b2111"/>
  <text class="badge" x="578" y="373" text-anchor="middle" fill="#ff9900">S3</text>
  <text class="name" x="600" y="374">Amazon S3</text>

  <rect class="tile" x="704" y="348" width="140" height="42" rx="10"/>
  <rect x="716" y="358" width="24" height="22" rx="6" fill="#2b1414"/>
  <text class="badge" x="728" y="373" text-anchor="middle" fill="#e5484d">B2</text>
  <text class="name" x="750" y="374">Backblaze B2</text>

  <rect class="tile" x="554" y="398" width="140" height="42" rx="10"/>
  <rect x="566" y="408" width="24" height="22" rx="6" fill="#2b1d11"/>
  <text class="badge" x="578" y="423" text-anchor="middle" fill="#f48120">R2</text>
  <text class="name" x="600" y="424">Cloudflare R2</text>

  <rect class="tile" x="704" y="398" width="140" height="42" rx="10"/>
  <rect x="716" y="408" width="24" height="22" rx="6" fill="#13242b"/>
  <text class="badge" x="728" y="423" text-anchor="middle" fill="#3bb3e0">W</text>
  <text class="name" x="750" y="424">Wasabi</text>

  <!-- footnote -->
  <text class="small" x="699" y="469" text-anchor="middle">+ any S3-compatible store, or a remote from your own rclone config</text>
</svg>
