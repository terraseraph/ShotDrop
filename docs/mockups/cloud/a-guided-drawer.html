<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShotDrop cloud mockup</title><style>:root{
  --bg:#0b0b0d;--stage:#08080a;--panel:#121215;--panel-2:#19191d;--panel-3:#222227;--line:#26262c;--line-2:#33333a;
  --text:#ececef;--muted:#8a8a94;--faint:#5b5b64;--tally:#ff5436;--tally-glow:rgba(255,84,54,.45);--live:#33d17a;
  --reject:#ef4b4b;--star:#f4c04e;--focus:#6ea8ff;--radius:8px;--radius-sm:6px;
  --font:'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif;--mono:'Cascadia Mono','SF Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.45,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:#050506;color:var(--text);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.mono{font-family:var(--mono)}
.ic{flex:none;display:block}
.link{color:var(--focus);text-decoration:underline;text-underline-offset:2px}
.row{display:flex;align-items:center;gap:10px}.row.tight{gap:6px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== mock page chrome (outside the app frame) ===== */
.page{max-width:1180px;margin:0 auto;padding:22px 24px 40px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.page-head .kicker{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tally)}
.page-head h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin-top:2px}
.page-head p{color:var(--muted);max-width:640px;margin-top:4px}
.page-head a{color:var(--muted);text-decoration:none;font-size:12px}.page-head a:hover{color:var(--text)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar .sep{width:1px;height:20px;background:var(--line-2);margin:0 6px}
.tchip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);font-size:12px;transition:.15s}
.tchip:hover{color:var(--text);border-color:var(--faint)}
.tchip.on{background:var(--text);color:#111;border-color:transparent;font-weight:600}
.where{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}
.where b{color:var(--text);font-weight:600}
.stage{display:flex;justify-content:center}
.frame{position:relative;width:100%;height:700px;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.6);transition:width .35s var(--ease)}
.stage.narrow .frame{width:380px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.note{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px}
.note h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note p{color:#c9c9d0;font-size:12.5px}

/* ===== faux app shell ===== */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.topbar{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:3px;background:var(--tally);box-shadow:0 0 12px var(--tally-glow)}
.livepill{display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;background:rgba(51,209,122,.1);color:var(--live);font:600 11px var(--mono)}
.livepill i{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 2s infinite}
.gallery{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;padding:8px;align-content:start;overflow:hidden}
.th{aspect-ratio:3/2;border-radius:4px;position:relative;overflow:hidden}
.th::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45))}
.th b{position:absolute;right:5px;bottom:4px;z-index:1;font:600 9px var(--mono);color:rgba(255,255,255,.75)}
.scrim{position:absolute;inset:0;background:rgba(4,4,6,.62);backdrop-filter:blur(2px);animation:fade .25s both}

/* ===== primitives ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--radius-sm);background:var(--panel-3);border:1px solid var(--line-2);white-space:nowrap;transition:transform .12s var(--ease),background .15s,border-color .15s}
.btn:hover:not(:disabled){background:#2a2a30;border-color:#44444c}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--text);color:#111;border-color:transparent;font-weight:600}
.btn.primary:hover:not(:disabled){background:#fff}
.btn.lg{height:40px;padding:0 20px;font-size:14px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn.ghost:hover:not(:disabled){color:var(--text);background:var(--panel-2);border-color:transparent}
.btn.danger{color:#ff8b8b}.btn.danger:hover:not(:disabled){background:rgba(239,75,75,.12);border-color:rgba(239,75,75,.4)}
.btn.warn{background:var(--tally);color:#fff;border-color:transparent;font-weight:600}.btn.warn:hover:not(:disabled){background:#ff6a50}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--radius-sm);color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}
.input{height:34px;width:100%;padding:0 10px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--line-2);outline:0;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(110,168,255,.18)}
.input.mono{font-family:var(--mono);font-size:12px}
.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--panel-3);color:var(--muted);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:rgba(51,209,122,.12);color:var(--live)}
.pill.run{background:rgba(110,168,255,.12);color:var(--focus)}.pill.run i{animation:pulse 1.4s infinite}
.pill.err{background:rgba(255,84,54,.14);color:#ff7a62}
.pill.pause{background:rgba(244,192,78,.12);color:var(--star)}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;background:var(--panel-3);color:#c6c6cd;font-size:11px;white-space:nowrap}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:rgba(110,168,255,.07);border:1px solid rgba(110,168,255,.22);color:#c4d6f6;font-size:12.5px}
.callout.warn{background:rgba(244,192,78,.07);border-color:rgba(244,192,78,.25);color:#e9d6a4}
.callout.err{background:rgba(255,84,54,.08);border-color:rgba(255,84,54,.3);color:#ffc2b6}
.callout .ic{margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--panel-3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--text);transition:width .5s var(--ease)}
.bar.sync>i{background:linear-gradient(90deg,var(--focus),#9cc2ff);position:relative;overflow:hidden}
.bar.sync>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.6s infinite}
.bar.err>i{background:var(--tally)}.bar.pause>i{background:var(--star)}
.bar.quota>i{background:#7d7d88}.bar.quota.hi>i{background:var(--star)}
.seg{display:flex;padding:3px;gap:2px;background:var(--bg);border:1px solid var(--line-2);border-radius:9px}
.seg button{flex:1;height:30px;border-radius:6px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s;padding:0 8px;white-space:nowrap}
.seg button:hover{color:var(--text)}.seg button.on{background:var(--panel-3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 6px rgba(0,0,0,.4)}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;transition:.15s}
.on>.radio,.radio.on{border-color:var(--text)}.on>.radio::after,.radio.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--text)}
details>summary{cursor:pointer;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary .ic{transition:transform .2s}details[open]>summary .ic{transform:rotate(90deg)}
.pm{display:grid;place-items:center;flex:none;border-radius:10px;background:var(--panel-3);border:1px solid var(--line-2)}
.pm svg{display:block}

/* ===== waiting ===== */
.ring{position:relative;display:grid;place-items:center}
.ring::before,.ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid var(--focus);opacity:0;animation:ring 2.4s var(--ease) infinite}
.ring::after{animation-delay:1.2s}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--text);animation:spin .8s linear infinite;flex:none}
.steps{padding:0;margin:0;counter-reset:s;display:flex;flex-direction:column;gap:9px}
.steps li{list-style:none;display:flex;gap:10px;color:#c6c6cd;font-size:12.5px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:var(--panel-3);display:grid;place-items:center;font:600 11px var(--mono);color:var(--muted)}
.steps li.done::before{content:"✓";background:rgba(51,209,122,.15);color:var(--live)}
.steps li.now::before{background:var(--focus);color:#0b0b0d}
.steps li.now{color:var(--text)}

/* ===== folder browser ===== */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:12.5px}
.crumbs button{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:5px;color:var(--muted);transition:.12s}
.crumbs button:hover{background:var(--panel-3);color:var(--text)}
.crumbs button.cur{color:var(--text);font-weight:600}
.crumbs .sl{color:var(--faint)}
.flist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow:hidden}
.frow{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .12s;color:var(--text)}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--panel-2)}
.frow .ic:first-child{color:var(--muted)}
.frow .go{margin-left:auto;color:var(--faint);opacity:0;transform:translateX(-4px);transition:.15s}
.frow:hover .go{opacity:1;transform:none}
.fempty{padding:22px 14px;text-align:center;color:var(--muted);font-size:12.5px}
.newf{display:flex;gap:6px;align-items:center}
.cols{display:flex;border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow:hidden;height:100%}
.col{flex:1;min-width:0;border-right:1px solid var(--line);overflow:auto;padding:4px}
.col:last-child{border-right:0}
.crow{display:flex;align-items:center;gap:8px;height:34px;padding:0 9px;border-radius:6px;width:100%;text-align:left;color:#d6d6dc;transition:background .12s}
.crow:hover{background:var(--panel-2)}.crow.sel{background:rgba(110,168,255,.16);color:#fff}
.crow .ic:first-child{color:var(--muted)}.crow .ic:last-child{margin-left:auto;color:var(--faint)}

/* ===== filter options ===== */
.fopt{display:flex;gap:12px;align-items:flex-start;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;width:100%;transition:.15s var(--ease)}
.fopt:hover{border-color:var(--line-2);background:var(--panel-2)}
.fopt.on{border-color:var(--text);background:var(--panel-2);box-shadow:0 0 0 1px var(--text) inset}
.fopt .ficon{width:36px;height:36px;border-radius:8px;background:var(--panel-3);display:grid;place-items:center;color:#cfcfd6;flex:none}
.fopt.on .ficon{background:var(--text);color:#111}
.fopt b{display:block;font-size:13.5px;font-weight:600}
.fopt span.d{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.fopt .meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}

/* ===== destination card ===== */
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .2s}
.dcard.err{border-color:rgba(255,84,54,.4)}
.dcard .dh{display:flex;gap:12px;padding:14px 14px 10px;align-items:flex-start}
.dcard .dm{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px}
.dcard .df{display:flex;gap:6px;padding:9px 10px;border-top:1px solid var(--line);background:rgba(255,255,255,.015);flex-wrap:wrap;align-items:center}
.dcard .path{font:12px var(--mono);color:#b9b9c2}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.kv b{color:var(--text);font-weight:500}
.confirm{margin:0 14px 12px;padding:10px 12px;border-radius:8px;border:1px solid rgba(239,75,75,.4);background:rgba(239,75,75,.07);animation:rise .25s var(--ease) both}

/* ===== motion ===== */
.enter>*{animation:rise .45s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetup{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script>/* Shared mock engine: fake data, components, tiny state machine. Not product code. */
const IC = {

const ic = (n, s = 16, extra = '') => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${IC[n]}</svg>`;

const MARK = {

const pm = (id, size = 40, glyph) => `<span class="pm" style="width:${size}px;height:${size}px">${MARK[id](glyph || Math.round(size * .55))}</span>`;

const PROVS = [
  { id: 'drive', name: 'Google Drive', sub: 'Your own Drive, 15 GB free on any Google account', badge: 'Most popular' },
  { id: 'dropbox', name: 'Dropbox', sub: 'Your own Dropbox, personal or team' },

const PNAME = { drive: 'Google Drive', dropbox: 'Dropbox', nas: 'Folder / NAS', custom: 'Custom remote' };
const EMAIL = { drive: 'ana@lumen.studio', dropbox: 'ana.reyes@gmail.com' };

const TREE = {

  dropbox: { '': ['Camera Uploads', 'Clients', 'ShotDrop'], 'Clients': ['Harlow & Finn', 'Okafor'], 'ShotDrop': ['Weddings'], 'ShotDrop/Weddings': [] },
  nas: { '': ['\\\\studio-nas\\photos'], '\\\\studio-nas\\photos': ['2026', 'Clients'] }
};
const FILTERS = [
  { id: 'all', ico: 'layers', name: 'Everything', d: 'Every photo, JPEG and RAW, as it arrives. A full backup.', meta: ['412 JPEG', '412 RAW', '≈ 18 GB'] },

document.head.insertAdjacentHTML('beforeend', `<style>${A_CSS}</style>`);

DIR.render = (S) => {
  const v = S.view, n = stepOf(v), narrow = S.width === 'narrow';
  let body = '', foot = '', wiz = n > 0;
  const head = (cap, title, sub) => `<div class="wiz-top"><button class="icon-btn" data-act="${n <= 1 ? 'view:empty' : n === 2 ? 'view:provider' : n === 3 ? 'view:provider' : 'view:folder'}" title="Back">${ic('back', 18)}</button>
    <div class="stepper">${A_STEPS.map((s, i) => `<i class="${i + 1 < n ? 'done' : i + 1 === n ? 'now' : ''}"></i>`).join('')}</div><span class="wiz-cap">${n} / 4</span></div>
    <div class="wiz-cap">${cap}</div><h3 class="wiz-h">${title}</h3><p class="muted" style="margin-bottom:16px">${sub}</p>`;

  if (v === 'empty') {
    body = `<div class="empty-hero"><div class="flow-ill"><span class="node">${ic('camera', 20)}</span><svg class="l"><line x1="0" y1="4" x2="60" y2="4"/></svg><span class="node" style="color:var(--text)">${ic('cloud', 20)}</span></div>
      <h3 style="font-size:18px;font-weight:650">Where should your photos go?</h3>
      <p class="muted" style="margin:6px auto 18px;max-width:340px">Right now shots stay on this PC. Add a destination and every new photo is copied there on its own.</p>
      <button class="btn primary lg" data-act="view:provider">${ic('plus', 16)} Add a destination</button>
      <p class="small faint" style="margin-top:14px">Google Drive · Dropbox · a NAS or folder · any rclone remote</p></div>`;
  } else if (v === 'connected') {
    const errs = S.variant === 'error';
    body = `<div class="row between" style="margin-bottom:12px"><div><h3 style="font-size:15px;font-weight:650">Destinations</h3><div class="small muted">${errs ? '<span style="color:#ff7a62">3 failed</span> · ' : ''}${S.paused ? 'paused' : errs ? 'waiting on sign-in' : '1 uploading'} · ${S.hasSecond ? '1 up to date' : ''}</div></div>
      <button class="btn" data-act="view:provider">${ic('plus', 14)} Add</button></div><div class="stack" style="gap:12px">${destCard({})}${S.hasSecond ? destCard({ nas: true }) : ''}</div>
      <p class="small faint" style="margin-top:14px;text-align:center">Shots always stay in your library on this PC. Destinations are copies.</p>`;
  } else if (v === 'provider') {
    wiz = true;
    body = head('Step 1 · Where', 'Where should photos go?', 'Pick one. You can add more later, each with its own folder and rules.') +
      `<div class="stack" style="gap:9px">${PROVS.map(p => { const on = S.provider === p.id;
        const row = `<button class="prow ${on ? 'on' : ''}" data-act="provider:${p.id}">${pm(p.id, 42)}<span class="grow"><b style="font-size:14px">${p.name}</b>${p.badge ? ` <span class="tag" style="margin-left:4px">${p.badge}</span>` : ''}<span class="small muted" style="display:block">${p.sub}</span></span><span class="radio ${on ? 'on' : ''}"></span></button>`;
        return (p.id === 'drive' || p.id === 'dropbox') && on ? `<div class="pwrap on">${row}<div class="pre">${preflight(p.id)}</div></div>` : (p.id === 'drive' || p.id === 'dropbox') ? `<div class="pwrap">${row}</div>` : `<div class="pwrap">${row}</div>`; }).join('')}</div>`;
    const sel = S.provider && (S.provider === 'drive' || S.provider === 'dropbox');
    foot = `<span class="small muted grow">${sel ? ic('lock', 12) + ' Opens your browser to sign in' : 'Choose a destination to continue'}</span><button class="btn primary" ${sel ? '' : 'disabled'} data-act="connect">${sel ? 'Continue in browser' : 'Continue'} ${ic('ext', 14)}</button>`;
  } else if (v === 'waiting') {
    body = head('Step 2 · Sign in', `Connecting ${PNAME[S.provider]}`, 'Nothing is hosted by us. The sign-in is between your browser and ' + (S.provider === 'drive' ? 'Google' : 'Dropbox') + ', and stays on this PC.') + waiting(S.provider);
    foot = `<span class="small muted grow"><button class="link" data-act="signedin">Mock: simulate "signed in"</button></span><button class="btn" data-act="cancel">Cancel</button>`;
  } else if (v === 'local') {
    body = head('Step 2 · Location', S.provider === 'nas' ? 'Choose the folder' : 'Name the remote', 'No sign-in needed. ShotDrop copies each photo here after it lands on this PC.') + localForm(S.provider);
    foot = `<button class="btn ghost" data-act="view:provider">Back</button><span class="grow"></span><button class="btn primary" data-act="localok">Continue</button>`;
  } else if (v === 'folder') {
    const acct = S.provider ? `<div class="where-card">${pm(S.provider, 30)}<div class="grow"><div class="small"><b>${EMAIL[S.provider]}</b></div><div class="small muted">${free(S.provider)} free</div></div><span class="pill ok"><i></i>Connected</span></div>` : '';
    body = head('Step 3 · Folder', 'Pick a folder', 'Photos are copied into the folder you open. Make a new one for each job, or reuse one.') + acct + driveScopeNote() +
      `<div style="margin:12px 0 8px">${crumbs(PNAME[S.provider])}</div><div class="flist">${folderList()}</div><div style="margin-top:10px">${newFolderRow()}</div>`;
    foot = `<div class="where-card grow" style="margin:0;padding:7px 10px;min-width:0">${ic('folder', 15)}<span class="path ell">${S.path.length ? S.path.join(' / ') : 'Top level of ' + PNAME[S.provider]}</span></div><button class="btn primary" data-act="view:filter">Use this folder</button>`;
  } else if (v === 'filter') {
    body = head('Step 4 · What to send', 'What should be copied?', 'Pick what lands in this folder. Add a second destination if you want RAWs in one place and JPEGs in another.') +
      `<div class="stack" style="gap:9px">${filterOpts('rich')}</div><div style="margin-top:16px"><label class="lbl">Name (just for you)</label><input class="input" placeholder="${PNAME[S.provider]} · ${S.path[S.path.length - 1] || 'ShotDrop'}" value=""></div>`;
    foot = `<span class="small muted grow ell">${FNAME[S.filter][0].toUpperCase() + FNAME[S.filter].slice(1)} → ${S.path[S.path.length - 1] || PNAME[S.provider]}</span><button class="btn primary" data-act="finish">Start syncing</button>`;
  }
  const w = narrow ? '100%' : '';
  return appBackdrop(`<div class="scrim"></div><aside class="drawer" style="${narrow ? 'width:100%;border:0' : ''}"><header class="dh2"><h2>Settings</h2><button class="icon-btn">${ic('x', 18)}</button></header>
    <nav class="tabs">${['Camera', 'Sync', 'Library', 'Remote'].map(t => `<button class="${t === 'Sync' ? 'on' : ''}">${t}</button>`).join('')}</nav>
    <div class="dbody" data-scroll><div data-body>${body}</div></div>${foot ? `<footer class="dfoot">${foot}</footer>` : ''}</aside>`);
};
boot({ kicker: 'Direction A', title: 'Guided drawer', where: 'Settings → Sync (same drawer as today), reused as step 3 of the first-run setup',
  blurb: 'One decision per screen, inside the existing Settings drawer. The wizard replaces the "Add destination" form; connected destinations become rich cards.',
  notes: [['Why it works', 'Lowest risk: no new surface, familiar drawer, a progress bar tells people how long the job is. Plain-language choices with real counts and sizes.'],
    ['Narrow width', 'The drawer goes full-bleed; footer buttons stay pinned to the bottom so Continue is always one thumb away.'],
    ['Trade-off', 'Four steps for something people do once. Power users adding a third destination will find it slower than a single form (see direction C).']] });
</script></body></html>
