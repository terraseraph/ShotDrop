<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShotDrop phone grid and filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111;color:#ededed;font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:#ededed;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.chip{height:34px;padding:0 12px;border-radius:17px;display:inline-flex;align-items:center;gap:6px;background:#1c1c1c;color:#c9c9c9;border:1px solid #2a2a2a;flex:0 0 auto;font-size:13px}
.chip.on{background:#2b2515;color:#f2b134;border-color:#5a4a1e}
.chip .n{color:#8a8a8a;font-size:11px}
.cell{position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:#222}
.cell .b{position:absolute;left:4px;bottom:4px;display:flex;gap:3px}
.badge{height:16px;padding:0 5px;border-radius:4px;display:inline-flex;align-items:center;font-size:10px;font-weight:600;background:rgba(0,0,0,.6);color:#ededed}
.badge.pick{background:#f2b134;color:#1a1200}
.badge.rej{background:#e5484d;color:#fff}
.badge.best{background:#3dd68c;color:#04170d}
.dim{opacity:.5}
@keyframes land{from{transform:translateY(14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.land{animation:land .54s linear(0,.071,.221,.388,.543,.672,.773,.848,.902,.94,.964,.98,.99,.996,.999,1.001,1.001,1.002,1.001,1.001,1.001,1.001,1) both;animation-delay:.5s}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#111;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:center;gap:10px;padding:14px 14px 8px">
    <div style="min-width:0;flex:1"><div style="font-size:18px;font-weight:600;color:#fff">Thu 6 Nov</div><div style="font-size:12px;color:#8a8a8a">Studio · 148 frames · 2 cameras</div></div>
    <button aria-label="Sessions" style="height:40px;padding:0 12px;border-radius:10px;background:#1a1a1a;display:flex;align-items:center;gap:6px;font-size:13px">Days <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button aria-label="Menu" style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#1a1a1a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>

  <!-- filter chips, horizontal scroll -->
  <div style="display:flex;gap:6px;padding:4px 14px 10px;overflow:hidden">
    <button class="chip on">All <span class="n">148</span></button>
    <button class="chip">Picks <span class="n">31</span></button>
    <button class="chip">★4+ <span class="n">18</span></button>
    <button class="chip">Best of burst <span class="n">22</span></button>
    <button class="chip">Soft</button>
  </div>

  <div style="flex:1 1 auto;min-height:0;overflow:auto;padding:0 14px">
    <div style="display:flex;align-items:center;gap:8px;color:#8a8a8a;font-size:12px;margin:4px 0 8px">14:32 <span style="height:1px;flex:1;background:#222"></span></div>
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:4px">
      <div class="cell land" style="background:linear-gradient(135deg,#4e5a66,#1a2027)"><div class="b"><span class="badge" style="background:#3dd68c;color:#04170d">new</span></div></div>
      <div class="cell" style="background:radial-gradient(120% 90% at 30% 20%,#6b5a48,#17171a);box-shadow:inset 0 0 0 2px #f2b134"><div class="b"><span class="badge best">best</span><span class="badge pick">P</span></div></div>
      <div class="cell dim" style="background:linear-gradient(135deg,#5c4e45,#211b18)"><div class="b"><span class="badge">soft</span></div></div>
      <div class="cell dim" style="background:linear-gradient(135deg,#5e5047,#231c19)"></div>
      <div class="cell dim" style="background:linear-gradient(135deg,#5a4c43,#201a17)"></div>
      <div class="cell" style="background:linear-gradient(135deg,#43525f,#1c2630)"><div class="b"><span class="badge">★3</span></div></div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;color:#8a8a8a;font-size:12px;margin:14px 0 8px">14:18 <span style="height:1px;flex:1;background:#222"></span></div>
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:4px">
      <div class="cell" style="background:linear-gradient(135deg,#5a4a3c,#221b17)"><div class="b"><span class="badge rej">X</span></div></div>
      <div class="cell" style="background:linear-gradient(135deg,#4b4f3c,#1d1f16)"><div class="b"><span class="badge">★5</span><span class="badge pick">P</span></div></div>
      <div class="cell" style="background:linear-gradient(135deg,#60574c,#231f1b)"></div>
      <div class="cell" style="background:linear-gradient(135deg,#4a3f52,#1a1620)"></div>
      <div class="cell" style="background:linear-gradient(135deg,#3c4b4d,#151d1e)"></div>
      <div class="cell" style="background:linear-gradient(135deg,#574a4a,#1f1818)"><div class="b"><span class="badge">★2</span></div></div>
      <div class="cell" style="background:linear-gradient(135deg,#4d5a4a,#1a2019)"></div>
      <div class="cell" style="background:linear-gradient(135deg,#5a5240,#201d16)"><div class="b"><span class="badge">00:14</span></div></div>
      <div class="cell" style="background:linear-gradient(135deg,#46475a,#18181f)"></div>
      <div class="cell" style="background:linear-gradient(135deg,#5b4c3e,#201b16)"></div>
      <div class="cell" style="background:linear-gradient(135deg,#3f5247,#161d19)"></div>
      <div class="cell" style="background:linear-gradient(135deg,#5a4a52,#201a1d)"></div>
    </div>
  </div>

  <!-- bottom tab bar -->
  <nav style="flex:0 0 auto;height:72px;display:flex;border-top:1px solid #222;background:#141414;padding-bottom:10px" aria-label="Main">
    <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#f2b134"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Gallery</a>
    <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#8a8a8a"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</a>
    <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#8a8a8a;position:relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.3M3 12a9 9 0 0 1 15.5-6.3"/><path d="M21 4v5h-5M3 20v-5h5"/></svg>Sync<span style="position:absolute;top:12px;right:28%;width:8px;height:8px;border-radius:50%;background:#5ba7f7"></span></a>
    <a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#8a8a8a"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
