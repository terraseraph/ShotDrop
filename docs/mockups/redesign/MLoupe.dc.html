<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShotDrop phone loupe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111;color:#ededed;font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:#ededed;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.badge{height:20px;padding:0 7px;border-radius:5px;display:inline-flex;align-items:center;font-size:11px;font-weight:600;background:rgba(0,0,0,.6);color:#ededed}
.badge.pick{background:#f2b134;color:#1a1200}
.cull{flex:1;height:52px;border-radius:12px;background:#1e1e1e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#c9c9c9;font-size:11px}
.cull svg{width:20px;height:20px}
.cull.on{background:#2b2515;color:#f2b134}
.thumb{flex:0 0 auto;width:48px;height:48px;border-radius:6px;background:#222}
@keyframes land{from{transform:translateX(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.land{animation:land .54s linear(0,.071,.221,.388,.543,.672,.773,.848,.902,.94,.964,.98,.99,.996,.999,1.001,1.001,1.002,1.001,1.001,1.001,1.001,1) both;animation-delay:.6s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,214,140,.55)}70%{box-shadow:0 0 0 6px rgba(61,214,140,0)}}
.live{animation:pulse 1.8s ease-out infinite}
.bar{height:4px;border-radius:2px;background:#262626;overflow:hidden;flex:1 1 40px;min-width:30px}
.bar i{display:block;height:100%;border-radius:2px;background:#3dd68c}
.bar.out i{background:#5ba7f7}
@keyframes recv{0%{width:8%}100%{width:92%}}
.recv{animation:recv 3.2s ease-in-out infinite}
@keyframes grow{from{width:52%}to{width:68%}}
.grow{animation:grow 6s ease-in-out infinite alternate}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.cap{font-size:9px;font-weight:700;letter-spacing:.06em;color:#8a8a8a;flex:0 0 auto}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#111;display:flex;flex-direction:column;overflow:hidden;border-radius:0">

  <!-- top -->
  <div style="height:52px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px 0">
    <button aria-label="Grid" style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#1a1a1a">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <div style="min-width:0;flex:1"><div style="font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Thu 6 Nov · Studio</div><div style="font-size:12px;color:#8a8a8a">148 of 148 · following</div></div>
    <button style="height:36px;padding:0 10px;border-radius:10px;background:#1a2e24;color:#3dd68c;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600"><span class="live" style="width:7px;height:7px;border-radius:50%;background:#3dd68c"></span>Follow</button>
    <button aria-label="Menu" style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#1a1a1a">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>

  <!-- transfer strip -->
  <div style="flex:0 0 auto;margin:10px 14px 0;display:flex;flex-direction:column;gap:5px;font-size:11px;color:#c9c9c9" aria-label="Transfers">
    <div style="display:flex;align-items:center;gap:7px;min-width:0">
      <span class="cap">IN</span><span class="dot live" style="background:#3dd68c"></span>
      <span class="mono" style="color:#fff;white-space:nowrap">DSC01249.ARW</span>
      <div class="bar"><i class="recv"></i></div>
      <span class="mono" style="color:#8a8a8a;white-space:nowrap">3 queued</span>
    </div>
    <div style="display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden">
      <span class="cap">OUT</span>
      <span class="dot" style="background:#3dd68c"></span><span>Drive</span>
      <span class="dot" style="background:#5ba7f7;margin-left:4px"></span><span>NAS</span>
      <div class="bar out"><i class="grow" style="width:52%"></i></div>
      <span class="mono" style="color:#8a8a8a">12 left</span>
      <span class="dot" style="background:#e5484d;margin-left:4px"></span><span style="color:#ff9a9d">Dropbox 48</span>
      <span class="dot" style="background:#555;margin-left:4px"></span><span style="color:#8a8a8a">SSD</span>
    </div>
  </div>

  <!-- photo: swipe left/right, pinch to zoom -->
  <div style="flex:1 1 auto;min-height:0;margin:8px 0 0;position:relative;background:radial-gradient(120% 90% at 30% 20%,#6b5a48 0%,#3a3230 40%,#17171a 100%)">
    <div style="position:absolute;left:12px;top:12px;display:flex;gap:6px"><span class="badge">Camera JPEG</span><span class="badge">Burst 4/6 · best</span></div>
    <div style="position:absolute;right:12px;top:12px"><span class="badge pick">P</span></div>
    <div style="position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px" aria-hidden="true">
      <span style="width:6px;height:6px;border-radius:50%;background:#444"></span><span style="width:6px;height:6px;border-radius:50%;background:#444"></span><span style="width:18px;height:6px;border-radius:3px;background:#f2b134"></span><span style="width:6px;height:6px;border-radius:50%;background:#444"></span>
    </div>
    <div style="position:absolute;right:12px;bottom:12px;display:flex;gap:6px"><span class="badge">pinch · 100%</span></div>
  </div>

  <!-- exif row -->
  <div class="mono" style="display:flex;justify-content:space-between;padding:10px 14px 4px;font-size:12px;color:#c9c9c9">
    <span>1/250</span><span>f/2.8</span><span>ISO 400</span><span>85 mm</span><span style="color:#8a8a8a">14:32</span>
  </div>

  <!-- stars -->
  <div style="display:flex;justify-content:center;gap:10px;padding:4px 14px 8px" aria-label="Rating 4 of 5">
    <button aria-label="1 star" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="#f2b134" aria-hidden="true"><path d="m12 2 3 6.6 7 .9-5.1 4.9 1.3 7.1L12 18l-6.2 3.5 1.3-7.1L2 9.5l7-.9z"/></svg></button>
    <button aria-label="2 stars" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="#f2b134" aria-hidden="true"><path d="m12 2 3 6.6 7 .9-5.1 4.9 1.3 7.1L12 18l-6.2 3.5 1.3-7.1L2 9.5l7-.9z"/></svg></button>
    <button aria-label="3 stars" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="#f2b134" aria-hidden="true"><path d="m12 2 3 6.6 7 .9-5.1 4.9 1.3 7.1L12 18l-6.2 3.5 1.3-7.1L2 9.5l7-.9z"/></svg></button>
    <button aria-label="4 stars" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="#f2b134" aria-hidden="true"><path d="m12 2 3 6.6 7 .9-5.1 4.9 1.3 7.1L12 18l-6.2 3.5 1.3-7.1L2 9.5l7-.9z"/></svg></button>
    <button aria-label="5 stars" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" aria-hidden="true"><path d="m12 2 3 6.6 7 .9-5.1 4.9 1.3 7.1L12 18l-6.2 3.5 1.3-7.1L2 9.5l7-.9z"/></svg></button>
  </div>

  <!-- culling bar, thumb reach -->
  <div style="display:flex;gap:8px;padding:0 14px 10px">
    <button class="cull on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>Pick</button>
    <button class="cull"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>Reject</button>
    <button class="cull"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>Label</button>
    <button class="cull"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="7" width="12" height="12" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></svg>Burst</button>
    <button class="cull"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Share</button>
  </div>

  <!-- filmstrip -->
  <div style="flex:0 0 auto;display:flex;gap:6px;padding:0 14px 12px;overflow:hidden">
    <div class="thumb" style="background:linear-gradient(135deg,#43525f,#1c2630)"></div>
    <div class="thumb" style="background:linear-gradient(135deg,#5a4a3c,#221b17)"></div>
    <div class="thumb" style="background:linear-gradient(135deg,#4b4f3c,#1d1f16);opacity:.5"></div>
    <div class="thumb" style="background:linear-gradient(135deg,#5c4e45,#211b18)"></div>
    <div class="thumb" style="background:radial-gradient(120% 90% at 30% 20%,#6b5a48,#17171a);box-shadow:0 0 0 2px #f2b134"></div>
    <div class="thumb" style="background:linear-gradient(135deg,#3f4a56,#171c22)"></div>
    <div class="thumb land" style="background:linear-gradient(135deg,#4e5a66,#1a2027);box-shadow:0 0 0 2px #3dd68c"></div>
  </div>

  <!-- dock -->
  <div style="flex:0 0 auto;height:34px;display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid #222;background:#141414;color:#8a8a8a;font-size:11px;white-space:nowrap;overflow:hidden">
    <span style="display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:#3dd68c"></span>2 cams</span>
    <span>148 today</span>
    <span style="display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:#5ba7f7"></span>NAS 12</span>
    <span style="margin-left:auto">412 GB</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
