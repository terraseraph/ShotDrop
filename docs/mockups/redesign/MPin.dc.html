<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShotDrop phone PIN gate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111;color:#ededed;font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:#ededed;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #3a3a3a}
.dot.f{background:#f2b134;border-color:#f2b134}
.k{height:64px;border-radius:14px;background:#1a1a1a;font-size:24px;font-weight:500;color:#fff;display:flex;align-items:center;justify-content:center}
@keyframes fill{from{transform:scale(.4)}to{transform:none}}
.dot.f{animation:fill .3s ease-out both}
.dot.f:nth-child(2){animation-delay:.15s}.dot.f:nth-child(3){animation-delay:.3s}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#111;display:flex;flex-direction:column;overflow:hidden;padding:0 24px 28px">

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f2b134" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
    <div>
      <div style="font-size:22px;font-weight:600;color:#fff">TERRA-DESKTOP</div>
      <div style="color:#8a8a8a;margin-top:4px">Thu 6 Nov · Studio · 148 frames so far</div>
    </div>
    <div style="color:#a3a3a3">Enter the PIN shown on the PC</div>
    <div style="display:flex;gap:16px;margin-top:6px" aria-label="3 of 4 digits entered">
      <span class="dot f"></span><span class="dot f"></span><span class="dot f"></span><span class="dot"></span>
    </div>
    <div style="font-size:12px;color:#6f6f6f;margin-top:10px">Scanned the QR? The PIN is already filled in next time. Add to home screen to skip this.</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px">
    <button class="k">1</button><button class="k">2</button><button class="k">3</button>
    <button class="k">4</button><button class="k">5</button><button class="k">6</button>
    <button class="k">7</button><button class="k">8</button><button class="k">9</button>
    <span></span><button class="k">0</button>
    <button class="k" aria-label="Delete" style="background:none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 6H8l-5 6 5 6h13z"/><path d="m12 9 5 6M17 9l-5 6"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
